name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Markdown Tree View
    uses: allurx/allurx-build/.github/workflows/node-ci.yml@71684ece317c5344be9f5dae18f2512c88bc56b1 # v1.0.0
    with:
      working-directory: skills/markdown-tree-view
