name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Markdown Tree View
    uses: allurx/allurx-build/.github/workflows/node-ci.yml@79ef08b3ae6b3b124bb9208199df562fd8107353 # workflows-v2.0.0
    with:
      working-directory: skills/markdown-tree-view
