name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Markdown Tree View
    uses: allurx/allurx-build/.github/workflows/node-ci.yml@e8af419cc31780e403856e40f099c03207cf6af2 # workflows-v2.2.0
    with:
      working-directory: skills/markdown-tree-view
