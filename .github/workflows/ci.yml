name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Markdown Tree View
    uses: allurx/allurx-build/.github/workflows/node-ci.yml@f3cd85d5d435fb3093ad3c027f6788923aa802e7 # workflows-v2.0.0
    with:
      working-directory: skills/markdown-tree-view
