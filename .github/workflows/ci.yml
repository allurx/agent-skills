name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Markdown Tree View
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: skills/markdown-tree-view
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: skills/markdown-tree-view/.node-version
          cache: npm
          cache-dependency-path: skills/markdown-tree-view/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Verify sources and distribution
        run: npm run verify
      - name: Verify public CLI behavior
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { spawnSync } from 'node:child_process';
          import { appendFileSync, copyFileSync, mkdtempSync, readFileSync, rmSync } from 'node:fs';
          import { tmpdir } from 'node:os';
          import { join, resolve } from 'node:path';

          const directory = mkdtempSync(join(tmpdir(), 'markdown-tree-view-ci-'));
          const input = join(directory, 'guide.md');
          const output = join(directory, 'guide.html');
          const cli = resolve('dist/markdown-tree-view/scripts/markdown-tree-view.mjs');
          const run = (expected, ...options) => {
            const result = spawnSync(process.execPath, [cli, '--input', input, '--output', output, ...options], { encoding: 'utf8' });
            assert.ifError(result.error);
            assert.equal(result.status, expected, result.stderr || result.stdout);
          };

          try {
            copyFileSync('examples/guide.md', input);
            run(0);
            const generated = readFileSync(output);
            const html = generated.toString('utf8');
            assert.ok(html.includes('<title>Project Handbook &amp; Notes · Markdown Tree View</title>'));
            assert.deepEqual([...html.matchAll(/data-heading-level="(\d+)"/g)].map((match) => Number(match[1])), [1, 2, 3, 3, 5, 2, 2, 2, 2]);
            assert.ok(html.includes('&lt;strong&gt;Raw HTML is displayed as text instead of executing or changing the page.&lt;/strong&gt;'));
            run(0, '--check');

            appendFileSync(input, '\n## CI changed input\n\nThis output is now stale.\n');
            run(1, '--check');
            assert.deepEqual(readFileSync(output), generated, '--check must not overwrite stale output');
            console.log('CLI generation, Markdown rendering, current/stale checks and read-only behavior passed.');
          } finally {
            rmSync(directory, { recursive: true, force: true });
          }
          NODE

  dependabot-merge:
    needs: verify
    permissions:
      contents: write
      pull-requests: write
    uses: allurx/web-foundation/.github/workflows/dependabot-merge.yml@main
